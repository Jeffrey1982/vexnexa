name: Post-deploy smoke test

# Vercel reports deploys back to GitHub as deployment_status events.
# Check the public production contract after a successful production deploy.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Production smoke test
    if: >
      github.event.deployment_status.state == 'success' &&
      (contains(github.event.deployment.environment, 'Production') ||
       contains(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the smoke checker
        run: node --experimental-strip-types --test scripts/production-smoke.test.mjs
      - name: Check critical pages and APIs
        env:
          BASE_URL: https://vexnexa.com
        run: node --experimental-strip-types scripts/production-smoke.mjs
