name: Post-deploy smoke test

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Production studio smoke test
    if: >-
      github.event.deployment_status.state == 'success' &&
      (contains(github.event.deployment.environment, 'Production') ||
       contains(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test smoke checker
        run: node --test scripts/production-smoke.test.mjs
      - name: Verify studio without email or billing side effects
        env:
          BASE_URL: https://vexnexa.com
        run: node scripts/production-smoke.mjs
